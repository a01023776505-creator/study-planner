<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Study Planner</h1>
        <p>나만의 공부 계획표를 만들어 보세요!</p>
    </header>

    <main>
        <section>
            <h2>학생 정보 입력</h2>

            <label for="grade">학년</label>
            <select id="grade">
                <option value="중1">중학교 1학년</option>
                <option value="중2">중학교 2학년</option>
                <option value="중3">중학교 3학년</option>
                <option value="고1">고등학교 1학년</option>
                <option value="고2">고등학교 2학년</option>
                <option value="고3">고등학교 3학년</option>
            </select>
<label for="major">원하는 학과를 작성하시오</label>

<input
    type="text"
    id="major"
    placeholder="예: 컴퓨터공학과, 전자공학과, 화학공학과"
>
            <label for="examDate">시험 날짜</label>
            <input type="date" id="examDate">

            <label for="studyTime">하루 공부 가능 시간</label>
            <input type="number" id="studyTime"
                   placeholder="예: 4시간" min="1" max="24">

            <h2>공부할 과목</h2>
<h3>공부할 과목을 선택하세요</h3>

<!-- 국어 -->
<h4>국어</h4>
<label><input type="checkbox" name="subject" value="문학"> 문학</label>
<label><input type="checkbox" name="subject" value="독서와 작문"> 독서와 작문</label>
<label><input type="checkbox" name="subject" value="화법과 언어"> 화법과 언어</label>

<!-- 영어 -->
<h4>영어</h4>
<label><input type="checkbox" name="subject" value="단어"> 단어</label>
<label><input type="checkbox" name="subject" value="문법"> 문법</label>
<label><input type="checkbox" name="subject" value="독해"> 독해</label>
<label><input type="checkbox" name="subject" value="듣기"> 듣기</label>

<!-- 수학 -->
<h4>수학</h4>
<label><input type="checkbox" name="subject" value="개념 학습"> 개념 학습</label>
<label><input type="checkbox" name="subject" value="유형 문제"> 유형 문제</label>
<label><input type="checkbox" name="subject" value="심화 문제"> 심화 문제</label>
<label><input type="checkbox" name="subject" value="오답 정리"> 오답 정리</label>

<!-- 과학 -->
<h4>과학</h4>
<label><input type="checkbox" name="subject" value="물리학"> 물리학</label>
<label><input type="checkbox" name="subject" value="화학"> 화학</label>
<label><input type="checkbox" name="subject" value="생명과학"> 생명과학</label>
<label><input type="checkbox" name="subject" value="지구과학"> 지구과학</label>

<!-- 사회 -->
<h4>사회</h4>
<label><input type="checkbox" name="subject" value="사회와 문화"> 사회와 문화</label>
<label><input type="checkbox" name="subject" value="윤리와 사상"> 윤리와 사상</label>
<label><input type="checkbox" name="subject" value="한국사"> 한국사</label>
<label><input type="checkbox" name="subject" value="세계사"> 세계사</label>
<label><input type="checkbox" name="subject" value="정치"> 정치</label>
<label><input type="checkbox" name="subject" value="법과 사회"> 법과 사회</label>
<label><input type="checkbox" name="subject" value="경제"> 경제</label>
            <button type="button" onclick="createPlan()">
                공부 계획표 생성하기
            </button>
        </section>

        <section>
            <h2>나의 공부 계획표</h2>

            <div id="result">
                정보를 입력하고 계획표를 생성해 주세요.
            </div>
        </section>
    </main>

    <footer>
        <p>Study Planner | 나만의 공부 습관 만들기</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
