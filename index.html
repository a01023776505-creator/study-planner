<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Study Planner</h1>
        <p>나만의 공부 계획표를 만들어 보세요!</p>
    </header>

    <main>
        <section>
            <h2>학생 정보 입력</h2>

            <label for="grade">학년</label>
            <select id="grade">
                <option value="중1">중학교 1학년</option>
                <option value="중2">중학교 2학년</option>
                <option value="중3">중학교 3학년</option>
                <option value="고1">고등학교 1학년</option>
                <option value="고2">고등학교 2학년</option>
                <option value="고3">고등학교 3학년</option>
            </select>

            <label for="examDate">시험 날짜</label>
            <input type="date" id="examDate">

            <label for="studyTime">하루 공부 가능 시간</label>
            <input type="number" id="studyTime"
                   placeholder="예: 4시간" min="1" max="24">

            <h2>공부할 과목</h2>

            <label>
                <input type="checkbox" name="subject" value="국어">
                국어
            </label>

            <label>
                <input type="checkbox" name="subject" value="영어">
                영어
            </label>

            <label>
                <input type="checkbox" name="subject" value="수학">
                수학
            </label>

            <label>
                <input type="checkbox" name="subject" value="과학">
                과학
            </label>

            <label>
                <input type="checkbox" name="subject" value="사회">
                사회
            </label>

            <button type="button" onclick="createPlan()">
                공부 계획표 생성하기
            </button>
        </section>

        <section>
            <h2>나의 공부 계획표</h2>

            <div id="result">
                정보를 입력하고 계획표를 생성해 주세요.
            </div>
        </section>
    </main>

    <footer>
        <p>Study Planner | 나만의 공부 습관 만들기</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
